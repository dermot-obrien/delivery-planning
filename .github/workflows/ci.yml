name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency on purpose, so this job needs no install step.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills
      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs .

  quarter-planning:
    name: quarter-planning tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install pyyaml
      - name: Test
        run: python -m unittest discover -s skills/quarter-planning/tests

  versions:
    name: Each skill's versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md and the marketplace entry agree, per skill
        run: |
          fail=0
          for d in skills/*/; do
            name=$(basename "$d")
            skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' "$d/SKILL.md")
            market=$(node -p "(require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === '$name') || {}).version")
            echo "$name: SKILL.md $skill, marketplace.json $market"
            [ "$skill" = "$market" ] || fail=1
          done
          exit $fail

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  ontology:
    name: Delivery ontology and the post-install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: python -m pip install pyyaml
      - name: The ontology module matches the fixture and refuses what it should
        run: python scripts/test_ontology.py
      # An installer runs each skill's check after installing it; this runs it the same way.
      - name: The post-install check passes on the fixture workspace
        run: node scripts/validate-bundle.mjs --run-checks skills/quarter-planning/tests/fixture --skills skills .
