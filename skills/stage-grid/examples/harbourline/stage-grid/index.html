<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stage grid</title>
<!--
  The stage grid app. Everything it shows comes from stage-grid-data.js beside it, which
  the stage-grid skill writes from the work graph. Opens from disk or from any static host;
  nothing is fetched. Every block is a button that opens a panel.
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5b6676; --faint: #9aa5b3; --line: #e3e7ec;
  --accent: #2f5fd0; --boundary: #c0392b; --strap: #eef0f4; --shadow: 0 10px 30px rgba(20, 30, 50, .18);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e8eaee; --muted: #a3acb9; --faint: #6f7987; --line: #2d333c;
    --accent: #7aa2ff; --strap: #232832; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 18px 24px 6px; display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 20px; }
header .sub { color: var(--muted); }
header .meta { margin-left: auto; color: var(--faint); font-size: 12px; }
main { padding: 6px 24px 24px; overflow-x: auto; }
table.grid { border-collapse: separate; border-spacing: 6px; width: 100%; min-width: 1100px; table-layout: fixed; }
col.label { width: 12%; }
th, td { vertical-align: top; padding: 0; text-align: left; }
.flag td { vertical-align: bottom; }
.pill { display: block; color: #fff; background: var(--sg); font-weight: 700; text-align: center; border-radius: 4px; padding: .3em .5em; font-size: 12px; }
.head th { background: var(--sg); border-radius: 4px 4px 0 0; border-bottom: 6px solid rgba(0, 0, 0, .16); }
button { font: inherit; }
.stage-btn { display: block; width: 100%; text-align: left; background: transparent; border: 0; color: #fff; font-size: 15px; font-weight: 700; padding: .45em .6em; cursor: pointer; }
.stage-btn:hover, .stage-btn.on { text-decoration: underline; text-underline-offset: 3px; }
.head th.corner { background: transparent; border: 0; }
.n { font-size: .75em; margin-right: .6em; opacity: .85; }
.card { display: block; width: 100%; text-align: left; cursor: pointer; background: var(--panel); border: 1px solid color-mix(in srgb, var(--sg) 35%, transparent); border-radius: 4px; padding: .5em .6em; height: 100%; font-size: 12px; color: var(--muted); }
.card:hover, .card.on { box-shadow: 0 0 0 2px var(--sg); }
.card .desc { display: block; color: var(--ink); font-size: 13px; padding-bottom: .4em; margin-bottom: .4em; border-bottom: 1px solid color-mix(in srgb, var(--sg) 35%, transparent); }
.card .lbl { display: block; text-transform: uppercase; letter-spacing: .04em; font-size: 10.5px; font-weight: 700; color: var(--faint); margin-bottom: .2em; }
.strap td { padding: 8px 0 2px; }
.strap .bar { background: var(--strap); border-left: 6px solid var(--boundary); border-radius: 4px; padding: .45em .8em; font-size: 15px; font-weight: 700; }
.lane th { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: .55em .6em; font-size: 14px; }
.lane-btn { background: transparent; border: 0; padding: 0; font-weight: 700; font-size: 14px; color: var(--ink); cursor: pointer; text-align: left; }
.lane-btn:hover { color: var(--accent); text-decoration: underline; }
.lane th .epics { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.lane td { background: color-mix(in srgb, var(--sg) 7%, var(--panel)); border-radius: 4px; padding: 5px; min-height: 40px; }
.lane td:empty::after { content: ""; display: block; min-height: 30px; }
.chip { display: inline-block; font: inherit; font-size: 12px; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 1px 8px; cursor: pointer; }
.chip:hover, .chip.on { background: var(--accent); color: #fff; }
.chip.static { cursor: default; color: var(--muted); border-color: var(--line); font-weight: 500; }
.chip.static:hover { background: transparent; color: var(--muted); }
.chip.static.on { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.linkish { background: transparent; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; font-size: 13px; }
.linkish:hover { text-decoration: underline; }
.item { display: block; width: 100%; text-align: left; font: inherit; font-size: 12.5px; color: var(--ink); background: var(--panel); border: 1px solid color-mix(in srgb, var(--sg) 45%, transparent); border-left: 4px solid var(--sg); border-radius: 4px; padding: .4em .55em; margin-bottom: 5px; cursor: pointer; }
.item:hover { box-shadow: 0 1px 4px rgba(0, 0, 0, .15); }
.item .ep { display: block; color: var(--faint); font-size: 11px; margin-top: 2px; }
.item.outcome { border-style: solid; background: color-mix(in srgb, var(--sg) 14%, var(--panel)); }
.item.outcome b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; color: var(--sg); }
.dim { opacity: .22; }
.hl { outline: 2px solid var(--accent); outline-offset: 1px; }
.bnd { position: relative; }
.bnd::before { content: ""; position: absolute; left: -5px; top: -3px; bottom: -3px; width: 3px; background: repeating-linear-gradient(to bottom, var(--boundary) 0 8px, transparent 8px 14px); }
.who td { padding-top: 10px; }
.who-btn { background: transparent; border: 0; padding: 0; color: var(--boundary); font-weight: 700; font-size: 12.5px; cursor: pointer; text-align: left; }
.who-btn:hover { text-decoration: underline; }
.who b { text-transform: uppercase; }
.bands td { border-radius: 4px; background: color-mix(in srgb, var(--sg) 14%, var(--panel)); }
.band-btn { display: block; width: 100%; background: transparent; border: 0; padding: .5em .4em; text-align: center; font-size: 12.5px; color: var(--sg); cursor: pointer; }
.band-btn b { font-weight: 700; }
.band-btn:hover { text-decoration: underline; }
.note { color: var(--muted); max-width: 1100px; margin-top: 14px; font-size: 13.5px; }
.warn { color: var(--boundary); font-size: 12px; }
/* Epic drawer */
#scrim { position: fixed; inset: 0; background: rgba(10, 15, 25, .25); opacity: 0; pointer-events: none; transition: opacity .15s; }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer { border-top: 6px solid var(--sg, var(--accent)); position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--panel); box-shadow: var(--shadow); transform: translateX(105%); transition: transform .2s; overflow-y: auto; padding: 18px 22px 30px; }
#drawer.open { transform: none; }
#drawer .close { position: absolute; top: 12px; right: 14px; border: 0; background: transparent; font-size: 22px; color: var(--muted); cursor: pointer; }
#drawer .kicker { color: var(--muted); font-size: 12px; }
#drawer h2 { margin: 4px 0 6px; font-size: 19px; padding-right: 30px; }
#drawer .facts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); margin: 6px 0 10px; }
#drawer .facts b { color: var(--ink); }
#drawer .goal { font-size: 13.5px; }
#drawer h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; }
.track { display: grid; gap: 3px; margin: 8px 0 2px; }
.track div { height: 26px; border-radius: 3px; background: color-mix(in srgb, var(--sg) 14%, var(--panel)); color: var(--sg); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.05; padding: 0 2px; }
.track div.has { background: var(--sg); color: #fff; }
.track-names { display: grid; gap: 3px; font-size: 10px; color: var(--faint); text-align: center; }
.dl { list-style: none; margin: 0; padding: 0; }
.dl li { padding: 6px 0 6px 10px; border-left: 4px solid var(--sg, var(--line)); margin-bottom: 4px; font-size: 13px; }
.dl li.hl { outline: 0; background: color-mix(in srgb, var(--accent) 10%, transparent); }
.dl .m { color: var(--faint); font-size: 11.5px; display: block; }
.dl a { color: var(--accent); }
.warn-line { color: var(--boundary); font-size: 12.5px; margin: 8px 0; }
.nav { margin-top: 18px; display: flex; justify-content: space-between; }
.stage-title { color: var(--sg, var(--ink)); }
.btn { display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 6px; background: var(--accent); color: #fff; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<header><h1 id="title"></h1><span class="sub" id="sub"></span><span class="meta" id="meta"></span></header>
<main><table class="grid" id="grid"></table><div class="note" id="note"></div><div id="warnings"></div></main>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"><button class="close" aria-label="Close">×</button><div id="drawer-body"></div></aside>
<script src="stage-grid-data.js"></script>
<script src="stage-grid.js"></script>
</body>
</html>
