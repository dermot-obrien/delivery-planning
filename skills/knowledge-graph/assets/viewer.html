<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1c1d21; --muted: #6b6e76; --line: #e3e3df;
  --edge: #b9bbc2; --edge-hi: #3a3d45; --accent: #2f5fd0; --stub: #9a9ca3;
  --c0:#4e79a7; --c1:#e15759; --c2:#59a14f; --c3:#edc948; --c4:#7f7f7f; --c5:#2f5fd0; --c6:#76b7b2;
  --c7:#f28e2b; --c8:#b07aa1; --c9:#9c755f; --c10:#ff9da7; --c11:#8c564b; --c12:#17becf; --c13:#bab0ac; --c14:#c7c7c7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15161a; --panel: #1d1f24; --ink: #e8e8ea; --muted: #9a9ca5; --line: #2c2f36;
    --edge: #4a4d56; --edge-hi: #d7d8dc; --accent: #7aa2ff; --stub: #70737b;
    --c0:#7aa6d6; --c1:#ff7b7d; --c2:#7fcf74; --c3:#f4d86b; --c4:#a5a5a5; --c5:#7aa2ff; --c6:#93d3ce;
    --c7:#ffab5e; --c8:#d49bc6; --c9:#c49a82; --c10:#ffb8c0; --c11:#c08479; --c12:#4fd6e6; --c13:#d0c8c4; --c14:#8b8b8b;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 380px; height: 100vh; }
header { grid-column: 1 / -1; display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 600; }
header .stats { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
input[type=search] { width: 240px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 5px 10px; font: inherit; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: #fff; }
#stage { position: relative; overflow: hidden; }
#stage svg { width: 100%; height: 100%; display: block; cursor: grab; }
.lane-label { fill: var(--muted); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.lane-rule { stroke: var(--line); stroke-dasharray: 2 6; }
.link { stroke: var(--edge); stroke-width: 1.1; fill: none; }
.link.hi { stroke: var(--edge-hi); stroke-width: 1.8; }
.node path { stroke: var(--panel); stroke-width: 1.5; cursor: pointer; }
.node.stub path { fill: transparent !important; stroke: var(--stub); stroke-dasharray: 3 2; }
.node.sel path { stroke: var(--ink); stroke-width: 3; }
.node text { font-size: 11px; fill: var(--ink); paint-order: stroke; stroke: var(--bg); stroke-width: 3px; pointer-events: none; }
.dim { opacity: .14; }
#crumb { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
aside { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: transparent; color: var(--muted); padding: 10px; font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }
.pane { padding: 14px 16px; overflow: auto; flex: 1; }
.pane[hidden] { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; margin: 2px 4px 2px 0; color: var(--ink); text-decoration: none; }
.chip.stub { border-style: dashed; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.role-badge { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
h2 { font-size: 17px; margin: 6px 0 2px; }
.id { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted); }
.cls { font-size: 12px; color: var(--muted); margin: 8px 0; padding: 8px 10px; background: var(--bg); border-radius: 6px; }
.cls code { color: var(--ink); }
.btn { display: inline-block; margin: 8px 8px 0 0; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-size: 13px; background: transparent; cursor: pointer; font-family: inherit; }
.btn.primary { background: var(--accent); color: #fff; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12.5px; margin: 12px 0; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.rel { margin: 6px 0; font-size: 12.5px; }
.rel .p { color: var(--muted); display: block; margin-bottom: 2px; }
.role-row { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 8px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.role-row .map { grid-column: 2 / -1; font-size: 11.5px; color: var(--muted); }
.role-row.unmapped .map { font-style: italic; }
.empty { color: var(--muted); }
.warn { font-size: 12px; color: var(--muted); border-left: 3px solid var(--c7); padding: 4px 8px; margin: 6px 0; }
@media (max-width: 820px) { #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title"></h1>
    <span class="stats" id="stats"></span>
    <span class="spacer"></span>
    <input type="search" id="search" placeholder="Find an id or name, then Enter" list="ids">
    <datalist id="ids"></datalist>
    <span class="seg" id="depth" title="How far from the focused node to show">
      <button data-d="1">1 hop</button><button data-d="2">2 hops</button><button data-d="3">3 hops</button><button data-d="0">All</button>
    </span>
  </header>
  <main id="stage"><svg id="svg"></svg><div id="crumb"></div></main>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="selected" aria-selected="true">Selected</button>
      <button role="tab" data-tab="roles">Roles</button>
      <button role="tab" data-tab="gaps">Gaps</button>
    </div>
    <div class="pane" id="pane-selected"></div>
    <div class="pane" id="pane-roles" hidden></div>
    <div class="pane" id="pane-gaps" hidden></div>
  </aside>
</div>
<script>/*{{D3}}*/</script>
<script>/*{{DATA}}*/</script>
<script>/*{{VIEWER}}*/</script>
</body>
</html>
