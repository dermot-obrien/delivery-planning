bindingsVersion = "1.0"

# A neutral workspace for the quarter-planning tests. Every path resolves against this
# file's directory.

[suite.quarter-planning]
sources      = "../planning/model"
register     = "../registers/deliverable-types.csv"
basis        = "../planning/{quarter}/{quarter}-planning-basis.csv"
calendar     = "../planning/{quarter}/{quarter}-calendar.csv"
resourcing   = "../planning/{quarter}/{quarter}-resourcing.csv"
quarterDir   = "../planning/{quarter}"
slugPattern  = '^(?P<y>\d{4})-q(?P<q>[1-4])$'
quarterLabel = "{y}-Q{q}"
ladder       = "../registers/ladder.csv"
epicsDir     = "../epics"
cardsDir     = "../planning/{quarter}/cards"
workItemsDir = "../work-items"
siteUrl      = "http://localhost:3000/docs/"
externalRefSystem = "tracker"

[suite.stage-grid]
# Shape only: the grid is built per quarter, so {quarter} defers the files to the run.
graph  = "../planning/{quarter}/graph.json"
config = "../planning/{quarter}/stage-grid.json"

# The post-install check runs every skill's check here. ontology and knowledge-graph keep
# no records of their own in this fixture, so they read the knowledge-graph example's.
[suite.ontology]
modules = [
  "../../../../knowledge-graph/examples/workspace/ontology/work.schema.json",
  "../../../../knowledge-graph/examples/workspace/ontology/delivery.schema.json",
]

[suite.knowledge-graph]
map = "../../../../knowledge-graph/examples/workspace/graph-map.json"
